name: App checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: App-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      # A hidden local sibling must never be required by the unit suite.
      LUMIVERSE_BACKEND_DIR: ${{ github.workspace }}/no-backend-checkout
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - name: Typecheck app tooling
        run: bun run typecheck
      - name: Test without a backend checkout
        run: bun run test:unit

  integration:
    name: Pinned backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      LUMIVERSE_BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Read the backend dependency pin
        id: backend-source
        shell: bash
        run: bun scripts/backend-source.ts >> "$GITHUB_OUTPUT"
      - name: Check out the pinned backend source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.backend-source.outputs.repository }}
          ref: ${{ steps.backend-source.outputs.ref }}
          path: backend
          sparse-checkout: src
          persist-credentials: false
      - name: Verify the backend revision
        run: bun scripts/backend-source.ts --verify
      - name: Install app test dependencies
        run: bun install --frozen-lockfile
      - name: Install locked backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile --ignore-scripts --omit=optional
      - name: Run backend integration tests
        run: bun run test:backend
